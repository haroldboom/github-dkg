[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-dkg"
version = "0.1.5"
description = "Ingest GitHub issues, PRs, and review comments into DKG v10 Working Memory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["dkg", "origintrail", "github", "knowledge-graph", "working-memory", "knowledge-assets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
github-dkg = "github_dkg.cli:main"

[project.urls]
Repository = "https://github.com/haroldboom/github-dkg"

[tool.hatch.build.targets.wheel]
packages = ["src/github_dkg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["demo.ipynb", "dist"]

[tool.ruff.lint.per-file-ignores]
# The demo script is left untouched (it is the published demo recording):
# one-line helper defs and cosmetic f-strings are intentional there.
"examples/demo_video.py" = ["E701", "F541"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
